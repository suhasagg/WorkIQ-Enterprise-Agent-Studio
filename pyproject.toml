[project]
name = "work-iq-enterprise-agent-studio"
version = "2.0.0"
description = "Work IQ Enterprise Agent Studio: LangGraph + MCP multi-agent platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "sqlalchemy>=2,<3",
  "alembic>=1.13,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "pgvector>=0.3,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3.0,<4",
  "langchain-core>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "mcp>=1.20,<2",
  "prometheus-client>=0.20,<1",
  "structlog>=24,<26",
  "tenacity>=9,<10",
  "PyJWT>=2.9,<3",
  "bcrypt>=4,<6",
  "jsonschema>=4.23,<5",
  "pypdf>=5,<7",
  "python-multipart>=0.0.9",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
  "azure-identity>=1.17,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.6,<1",
  "reportlab>=4,<5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["seed/data/**/*", "evals/datasets/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["frontend", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
